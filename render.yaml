services:
  - type: web
    name: carbon-frontier
    rootDir: carbon-frontier
    runtime: python
    # 3.12 keeps numpy/openpyxl on prebuilt manylinux wheels (fast, reliable builds).
    pythonVersion: 3.12
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health